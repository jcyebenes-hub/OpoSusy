# Render Blueprint — OPO-PRO (OpoSusy)
# Despliegue con un clic: Render Dashboard -> New -> Blueprint
# Importa la rama arena/01a0c488-oposusy: cada push se despliega solo.
#
# Keep-alive anti-sleep: ver .github/workflows/keepalive.yml
# (ping a /api/health cada 10 min, gratis en repos publicos de GitHub).

services:
  - type: web
    name: oposusy-opo-pro
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # GEMINI_API_KEY (opcional): si la quieres, anadela despues en
      #   servicio oposusy-opo-pro -> Environment -> Add Environment Variable
      # Sin ella la app funciona completa, solo sin el tutor IA.
